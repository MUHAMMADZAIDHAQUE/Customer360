name: Customer360 CI/CD Quality Pipeline

# ==============================================================================
# Customer360 - Continuous Integration & Quality Gate Enforcement
# AI-Powered Customer Intelligence & Retention Platform
# ==============================================================================

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20.x"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Python Code Quality & Linting Gate
  # ---------------------------------------------------------------------------
  python-lint:
    name: Python Linting & Code Hygiene (flake8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Linter Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Python Linting Checks
        run: |
          flake8 api analytics ml tests

  # ---------------------------------------------------------------------------
  # 2. Frontend Validation Gate (TypeScript & Production Build)
  # ---------------------------------------------------------------------------
  frontend-checks:
    name: Frontend TypeScript & Vite Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run Vitest Frontend Unit & Component Tests
        run: npm test

      - name: Build Production Frontend Bundle
        run: npm run build

  # ---------------------------------------------------------------------------
  # 3. Backend Integration & Unit Test Suite
  # ---------------------------------------------------------------------------
  backend-tests:
    name: Backend Test Suite (Pytest & FastAPI)
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      DEBUG: false
      DATABASE_URL: "sqlite:///:memory:"
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Full Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Execute Pytest Suite (70+ Tests)
        run: |
          pytest tests/ -v --durations=10

  # ---------------------------------------------------------------------------
  # 4. dbt Analytics Engineering Model & Integrity Tests
  # ---------------------------------------------------------------------------
  dbt-tests:
    name: dbt Analytics Marts Integrity Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dbt Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core dbt-duckdb

      - name: Run dbt Data Integrity Tests
        run: |
          dbt test --project-dir dbt --profiles-dir dbt

  # ---------------------------------------------------------------------------
  # 5. Data Quality & Observability 105-Check Gate
  # ---------------------------------------------------------------------------
  data-quality-tests:
    name: Data Quality 105-Check Observability Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Data Quality Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Full 105-Check Quality Gate
        run: |
          python analytics/data_quality.py

  # ---------------------------------------------------------------------------
  # 6. Docker Container Image Build Validation
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build FastAPI Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: api/Dockerfile
          push: false
          tags: customer360-api:latest

      - name: Build React Frontend Nginx Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: false
          tags: customer360-frontend:latest

  # ---------------------------------------------------------------------------
  # 7. Pull Request Quality Gatekeeper
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Customer360 PR Quality Gatekeeper
    runs-on: ubuntu-latest
    needs:
      - python-lint
      - frontend-checks
      - backend-tests
      - dbt-tests
      - data-quality-tests
      - docker-build
    if: always()
    steps:
      - name: Evaluate Upstream Quality Gates
        run: |
          echo "Evaluating Customer360 CI/CD Quality Gates..."
          if [[ "${{ needs.python-lint.result }}" != "success" ]]; then
            echo "❌ Python Lint Gate failed"
            exit 1
          fi
          if [[ "${{ needs.frontend-checks.result }}" != "success" ]]; then
            echo "❌ Frontend Checks Gate failed"
            exit 1
          fi
          if [[ "${{ needs.backend-tests.result }}" != "success" ]]; then
            echo "❌ Backend Tests Gate failed"
            exit 1
          fi
          if [[ "${{ needs.dbt-tests.result }}" != "success" ]]; then
            echo "❌ dbt Tests Gate failed"
            exit 1
          fi
          if [[ "${{ needs.data-quality-tests.result }}" != "success" ]]; then
            echo "❌ Data Quality Gate failed"
            exit 1
          fi
          if [[ "${{ needs.docker-build.result }}" != "success" ]]; then
            echo "❌ Docker Build Gate failed"
            exit 1
          fi
          echo "✅ ALL QUALITY GATES PASSED! Ready for merge/deployment."
