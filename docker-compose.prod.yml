version: '3.8'

# ==============================================================================
# Customer360 - Hardened Production Multi-Container Orchestration
# AI-Powered Customer Intelligence & Retention Platform
# ==============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL Database Service (Isolated to Internal Network)
  # In cloud production: Replace with AWS RDS / GCP Cloud SQL managed instance
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: customer360_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-customer360_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password must be provided}
      POSTGRES_DB: ${POSTGRES_DB:-customer360_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    # In production, DO NOT expose port 5432 to the host or internet.
    # Database is accessible ONLY through the internal backend network.
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/indexes.sql:/docker-entrypoint-initdb.d/02_indexes.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-customer360_user} -d ${POSTGRES_DB:-customer360_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - backend_internal_net

  # ---------------------------------------------------------------------------
  # 2. FastAPI Backend API Service (Non-Root, Multi-Worker)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: customer360_prod_api
    restart: always
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-customer360_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Database password must be provided}
      - POSTGRES_DB=${POSTGRES_DB:-customer360_db}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-customer360_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-customer360_db}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:80}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro
      - ./ml/artifacts:/app/ml/artifacts:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - frontend_public_net
      - backend_internal_net

  # ---------------------------------------------------------------------------
  # 3. React Frontend Web Client (Nginx Reverse Proxy & Static Caching)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: customer360_prod_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.2'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - frontend_public_net

# -----------------------------------------------------------------------------
# Isolated Networks & Persistent Volumes
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
    name: customer360_prod_postgres_data
    driver: local

networks:
  # Public ingress network for Nginx & Web clients
  frontend_public_net:
    name: customer360_frontend_public_net
    driver: bridge

  # Private backend network isolated from public ingress
  backend_internal_net:
    name: customer360_backend_internal_net
    driver: bridge
    internal: true
