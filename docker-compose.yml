version: '3.8'

services:
  # FastAPI Backend Service
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: customer360_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    networks:
      - customer360_network

  # React + Vite Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: customer360_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - api
    networks:
      - customer360_network

  # PostgreSQL Relational Data Warehouse / Store
  postgres:
    image: postgres:16-alpine
    container_name: customer360_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-customer360_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-customer360_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-customer360_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-customer360_user} -d ${POSTGRES_DB:-customer360_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - customer360_network

volumes:
  postgres_data:
    driver: local

networks:
  customer360_network:
    driver: bridge
