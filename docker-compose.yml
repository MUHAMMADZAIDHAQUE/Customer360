version: '3.8'

# ==============================================================================
# Customer360 - Production Multi-Container Orchestration (Docker Compose)
# AI-Powered Customer Intelligence & Retention Platform
# ==============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL Database Service
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: customer360_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-customer360_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-customer360_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-customer360_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/indexes.sql:/docker-entrypoint-initdb.d/02_indexes.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-customer360_user} -d ${POSTGRES_DB:-customer360_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - customer360_network

  # ---------------------------------------------------------------------------
  # 2. FastAPI Backend API Service
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: customer360_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - LOG_LEVEL=INFO
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-customer360_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-customer360_secure_password}
      - POSTGRES_DB=${POSTGRES_DB:-customer360_db}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-customer360_user}:${POSTGRES_PASSWORD:-customer360_secure_password}@postgres:5432/${POSTGRES_DB:-customer360_db}
      - CORS_ORIGINS=http://localhost:3000,http://localhost:80,http://127.0.0.1:3000,http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - customer360_network

  # ---------------------------------------------------------------------------
  # 3. React Frontend Service (Served via Nginx)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: customer360_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - customer360_network

# -----------------------------------------------------------------------------
# Persistent Volumes & Private Bridge Network
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
    name: customer360_postgres_data
    driver: local

networks:
  customer360_network:
    name: customer360_network
    driver: bridge
