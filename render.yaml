# ==============================================================================
# Customer360 - Render Infrastructure-as-Code Blueprint
# AI-Powered Customer Intelligence & Retention Platform
# ==============================================================================
# Deploys:
# 1. Managed PostgreSQL database (customer360-db)
# 2. FastAPI Backend Python Web Service (customer360-api)
# 3. React Frontend Static Web Application (customer360-frontend)
# ==============================================================================

version: "1"

databases:
  - name: customer360-db
    databaseName: customer360_db
    user: customer360_user
    plan: free
    region: oregon
    ipAllowList: []

services:
  # ---------------------------------------------------------------------------
  # 1. FastAPI Backend Analytical API Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: customer360-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: API_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: customer360-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://customer360-frontend.onrender.com,https://customer360.onrender.com,http://localhost:5173,http://localhost:3000"
      - key: OPENAI_API_KEY
        sync: false

  # ---------------------------------------------------------------------------
  # 2. React + Vite Frontend Static Single-Page Application
  # ---------------------------------------------------------------------------
  - type: web
    name: customer360-frontend
    runtime: static
    buildCommand: "cd frontend && npm ci && npm run build"
    staticPublishPath: "./frontend/dist"
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: customer360-api
          property: host
